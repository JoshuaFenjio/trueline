# Runs the Trueline scraper every 6 hours and writes fresh data to Supabase.
#
# Why GitHub Actions and not a Vercel cron: the scraper is a multi-hour Python
# job (1,000+ companies, polite delays, tens of thousands of postings upserted
# to Supabase). Vercel's free serverless functions time out long before it
# finishes. GitHub Actions is free for public repos, so it's the right home.
#
# WHY SHARDED: measured across 11 runs, the sequential pass costs ~20s/company.
# At 312 companies that was ~105 min (min 83, max 133). At 1,000+ it would be
# ~5.5 HOURS — past any timeout we could set, past the 6-hour gap between
# scheduled runs (so runs would pile up), and past GitHub's own 360-minute job
# ceiling. Raising timeout-minutes alone could not fix that. So the list is
# split across 4 parallel jobs (~85 min each) via SHARD_INDEX / SHARD_COUNT.
#
# Shards are safe to run concurrently: each one touches a disjoint set of
# companies, and every Supabase write (upsert_posting / expire_unseen) is
# scoped to one company at a time.
#
# SETUP (once): in the GitHub repo -> Settings -> Secrets and variables ->
# Actions, add two repository secrets:
#   SUPABASE_URL          your https://xxxx.supabase.co
#   SUPABASE_SERVICE_KEY  your service_role key
name: Refresh salary data

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch: {} # lets you run it manually from the Actions tab

# A scheduled run must never start while the previous one is still going —
# overlapping shards would double the write load on Supabase for no benefit.
concurrency:
  group: refresh-salary-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ~85 min expected per shard at 1,000 companies. 240 is deliberate slack for
    # a slow ATS or a retry storm; a shard that hits it was hung, not just busy.
    timeout-minutes: 240
    strategy:
      fail-fast: false # one bad shard must not cancel the other three
      matrix:
        shard: [0, 1, 2, 3]
    name: refresh (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 4
        run: python -u pipeline.py

  # Additional permitted sources (new_sources.py). These touch a disjoint set of
  # rows from the sharded ATS scrape (Personio feeds, Landing.jobs sentinel), so
  # they run ONCE per cycle as their own job — not inside the shard matrix, which
  # would fire them 4x and duplicate the same writes. Adzuna/Reed are scaffold-
  # only: they no-op without ADZUNA_APP_ID/ADZUNA_APP_KEY / REED_API_KEY and
  # auto-activate the moment those secrets exist.
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: extra sources (personio + landing)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch permitted extra sources -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ITJOBS_API_KEY: ${{ secrets.ITJOBS_API_KEY }}
        run: |
          python -u new_sources.py germantechjobs --apply
          python -u new_sources.py himalayas --apply
          python -u new_sources.py landing --apply
          python -u new_sources.py personio --apply
          python -u new_sources.py itjobs --apply
          python -u new_sources.py adzuna --apply
          python -u new_sources.py reed --apply
